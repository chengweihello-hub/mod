<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>执行计划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef0f4;
      --card: #ffffff;
      --text-primary: #1f2329;
      --text-secondary: #5f6b7a;
      --border: #e1e4e8;
      --blue: #1a6fd8;
      --blue-hover: #155ab3;
      --blue-active: #114a94;
      --blue-soft: #e8f1fb;
      --shadow: 0 24px 80px rgba(31, 35, 41, 0.16), 0 8px 24px rgba(31, 35, 41, 0.08);
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      padding: 24px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(26, 111, 216, 0.06), transparent 60%),
                  rgba(31, 35, 41, 0.18);
      backdrop-filter: blur(3px);
      z-index: 0;
    }

    .modal {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .btn-close {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: #8a96a6;
      transition: all 0.2s ease;
    }

    .btn-close svg {
      width: 18px;
      height: 18px;
    }

    .btn-close:hover {
      background: #f3f5f8;
      color: var(--text-primary);
    }

    .btn-close:active {
      background: #eaedf1;
    }

    .modal-body {
      padding: 26px 28px 8px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-primary);
    }

    .info-block {
      margin-bottom: 22px;
    }

    .info-block p {
      margin-bottom: 6px;
    }

    .plan-id {
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
    }

    .choice-title {
      font-weight: 500;
      margin-bottom: 14px;
      color: var(--text-primary);
    }

    .radio-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
      background: #fff;
    }

    .radio-card:hover {
      border-color: #b6c4d6;
      background: #fafbfc;
    }

    .radio-card:has(input:checked) {
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .radio-card input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .radio-marker {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: 2px solid #c4cdd8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .radio-marker::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      transform: scale(0);
      transition: transform 0.18s ease;
    }

    .radio-card input:checked + .radio-marker {
      border-color: var(--blue);
      background: var(--blue);
    }

    .radio-card input:checked + .radio-marker::after {
      transform: scale(1);
    }

    .radio-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .radio-hint {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .extra-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      margin-top: 10px;
      background: #f0f7ff;
      border: 1px solid #d6e8fa;
      border-radius: 8px;
      font-size: 13px;
      color: #1a6fd8;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 28px 26px;
    }

    .btn {
      padding: 10px 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      outline: none;
      border: 1px solid transparent;
      min-width: 88px;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #f7f8fa;
      border-color: #cdd4dd;
    }

    .btn-secondary:active {
      background: #f0f2f5;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .btn-primary:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      background: var(--blue-active);
      border-color: var(--blue-active);
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      .modal {
        border-radius: 12px;
      }
      .modal-header,
      .modal-body,
      .modal-footer {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="modal-header">
      <h2 id="dialog-title" class="modal-title">执行</h2>
      <button class="btn-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="info-block">
        <p>发现已执行计划，执行于 2026-07-28 14:22:33。</p>
        <p class="plan-id">计划id：xxxxxxxxxxxxxxxxxxxxxxxxxxxx。</p>
      </div>

      <div class="choice-title">请选择</div>
      <div class="radio-list" role="radiogroup" aria-label="执行选项">
        <label class="radio-card">
          <input type="radio" name="execute-option" value="continue" checked />
          <span class="radio-marker"></span>
          <span class="radio-text">
            1、继续执行
            <span class="radio-hint">（不会消耗时间）</span>
          </span>
        </label>
        <label class="radio-card">
          <input type="radio" name="execute-option" value="regenerate" />
          <span class="radio-marker"></span>
          <span class="radio-text">
            2、重复生成计划
            <span class="radio-hint">（会消耗 3-5 分钟）</span>
          </span>
        </label>
        <div id="extra-hint" class="extra-hint" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="#1a6fd8" stroke-width="1.5"/>
            <line x1="8" y1="7" x2="8" y2="11" stroke="#1a6fd8" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="5" r="0.8" fill="#1a6fd8"/>
          </svg>
          <span>适用于需要取最新配置的执行场景。</span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button">取消</button>
      <button class="btn btn-primary" type="button">执行</button>
    </div>
  </div>

  <script>
    const radios = document.querySelectorAll('input[name="execute-option"]');
    const extraHint = document.getElementById('extra-hint');

    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        extraHint.style.display = radio.value === 'regenerate' ? 'flex' : 'none';
      });
    });
  </script>
</body>
</html>
